[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperorder"
version = "0.3.0"
description = "Paired structural-semantic continuations and divergence-family convergence research"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Tyler Roost / TimeLordRaps"}]

[project.urls]
Repository = "https://github.com/TimeLordRaps/hyperorder"
Theory = "https://github.com/TimeLordRaps/hyperorder/blob/main/THEORY.md"

[project.scripts]
hyperorder = "hyperorder:main"

[tool.setuptools]
py-modules = ["hyperorder", "dichrome", "quadrilateral"]
